
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRTANSAN AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>VIRTANSAN AI</h1>
    <p>AI-Powered Enterprise Helpdesk</p>

    <div id="chat">
        <div id="messages">
            <p><strong>VIRTANSAN AI:</strong> Hello! How can I help you with your IT concern?</p>
        </div>

        <form id="chat-form">
            <input
                type="text"
                id="message-input"
                placeholder="Type your IT question..."
                required
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
