
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRTANSAN AI</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
    <h1>VIRTANSAN AI</h1>
    <p>AI-Powered Enterprise Helpdesk</p>

    <div id="chat">
        <div id="messages" aria-live="polite">
            <div class="message ai-message">
                <strong>VIRTANSAN AI</strong>
                <div class="reply-text">Hey there! 👋 Welcome! I'm VIRTANSAN AI.

I'm here to help you figure out IT problems and find solutions. Just tell me what's going on, and we'll work through it together.

What's up? How can I help you today?</div>
            </div>
        </div>

        <form id="chat-form">
            <input
                type="text"
                id="message-input"
                placeholder="Tell me what's going on..."
                required
                autocomplete="off"
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/static/script.js?v=3"></script>
</body>
</html>
